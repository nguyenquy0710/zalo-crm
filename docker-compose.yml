# # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #
# ZaloCRM
# -----------------------------------------
# GitHub: https://github.com/nguyenquy0710/zalo-crm
#   https://github.com/nguyenquy0710/zalo-crm/pkgs/container/zalo-crm
# Documentation: https://deplaoapp.com/
# -----------------------------------------
# [nqdev] 1 image duy nhất "zalo-crm" gồm cả backend (REST + Socket.IO, port 9900) và web UI
# (SPA serve trực tiếp từ Node, cùng port) — không còn image "zalo-crm-web"/nginx riêng.
# Truy cập UI: http://<host>:10030/ — API: http://<host>:10030/api/*
# -----------------------------------------
# START: docker-compose up -d --build --force-recreate --remove-orphans
# STOP: docker-compose down -v --remove-orphans
# # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #

services:
  zalo-crm-10030:
    image: ghcr.io/nguyenquy0710/zalo-crm:26.8.11-manual
    container_name: zalo-crm-api-10030
    restart: unless-stopped
    # network_mode: host
    ports:
      - "10030:9900"   # HttpRelayService: REST + Socket.IO (API + Web UI)
      - "10031:80"     # Web UI (giữ port quen thuộc 80 - listener thứ 2, cùng nội dung với 9900)
      #- "10032:9888"   # IntegrationRegistry webhook
      #- "10033:9889"   # WebhookGatewayService
    environment:
      - TZ=Asia/Ho_Chi_Minh
      # Bật listener thứ 2 trên port 80 trong container (xem HttpRelayService.ts
      # startWebPortListener) - dùng chung router với 9900 nên API + Web UI hoạt động y hệt
      # trên cả 2 port. Bỏ dòng này nếu chỉ cần 1 port duy nhất (9900).
      - ZALOCRM_WEB_PORT=80
      # Khoá mã hoá secret (thay OS keychain) — bắt buộc, tự sinh 1 lần rồi giữ nguyên
      # (đổi khoá = không giải mã lại được secret cũ đã lưu). Ví dụ tạo: openssl rand -hex 32
      # - ZALOCRM_SECRET_KEY=${ZALOCRM_SECRET_KEY:?Cần set ZALOCRM_SECRET_KEY (vd: openssl rand -hex 32)}
      - ZALOCRM_SECRET_KEY=${ZALOCRM_SECRET_KEY:-8f508251a5fe3ce7bc1832c115d0b40babbe4433fc2ca6e745b2669edd099db7}
    env_file:
      - .env
    #depends_on:
    #  - n8n_db
    #  - n8n_redis
    volumes:
      - ./data/zalo-crm:/data/.config/ZaloCRM
    dns:
      - 1.1.1.1
      - 1.0.0.1
      - 8.8.8.8
      - 8.8.4.4
    extra_hosts:
      - "host.docker.internal:host-gateway" # Để kết nối đến localhost của host từ container
      - "minipc-quyit:192.168.1.200"
    ulimits:
      nproc: 65536 # Giới hạn số lượng tiến trình con mà container có thể tạo ra
      nofile: # Giới hạn số lượng file mà container có thể mở cùng lúc
        soft: 102400
        hard: 102400
    deploy:
      resources:
        limits:
          cpus: "0.50" # Giới hạn 80% CPU
          memory: "1G" # Giới hạn 3.2GB RAM (80% của 4GB)
        reservations:
          memory: "256M" # Đảm bảo container có ít nhất 256MB RAM

