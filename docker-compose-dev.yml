# Service "api": backend + web UI gộp chung 1 image "zalo-crm", nhưng chạy 2 tiến trình
# ĐỘC LẬP bên trong (xem docker/entrypoint.sh) — nginx phục vụ web tĩnh (port 80), Node
# phục vụ API/Socket.IO (port 9900), không proxy chung origin (không còn image/service "web"
# nginx riêng để publish, chỉ gộp chung 1 Dockerfile/image). Dùng image đã publish sẵn thay
# vì `build: .` — tránh build lại cục bộ (máy build ít RAM từng bị OOM, xem Dockerfile).
# Muốn build lại từ source: đổi `image:` thành `build: .` (dùng target mặc định "runtime").
#
# Web UI: http://localhost:8080/ — API: http://localhost:9900/api/* (nhập ở màn đăng nhập web)
services:
  zalo-crm-10030:
    image: ghcr.io/nguyenquy0710/zalo-crm:26.8.9-manual
    ports:
      - "9900:9900"   # HttpRelayService (Node): REST + Socket.IO
      - "8080:80"     # nginx: Web UI tĩnh (SPA)
      - "9888:9888"   # IntegrationRegistry webhook
      - "9889:9889"   # WebhookGatewayService
    volumes:
      - zalocrm-data:/data
    environment:
      # Khoá mã hoá secret (thay OS keychain) — bắt buộc, tự sinh 1 lần rồi giữ nguyên
      # (đổi khoá = không giải mã lại được secret cũ đã lưu). Ví dụ tạo: openssl rand -hex 32
      # - ZALOCRM_SECRET_KEY=${ZALOCRM_SECRET_KEY:?Cần set ZALOCRM_SECRET_KEY (vd: openssl rand -hex 32)}
      - ZALOCRM_SECRET_KEY=8f508251a5fe3ce7bc1832c115d0b40babbe4433fc2ca6e745b2669edd099db7
    restart: unless-stopped

volumes:
  zalocrm-data:
