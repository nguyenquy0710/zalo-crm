name: ZaloCRM Build and Push Docker Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    # Dockerfile có 2 stage image tách riêng: "runtime" (backend headless, không
    # kèm bundle renderer) và "web" (SPA tĩnh qua nginx, không kèm node_modules) -
    # publish thành 2 image riêng, mỗi cái nhỏ gọn hơn 1 image gộp cả 2. max-parallel: 1
    # để tránh 2 job cùng ghi buildcache lên chung 1 tag registry cùng lúc.
    strategy:
      max-parallel: 1
      matrix:
        include:
          - target: runtime
            ghcr_image: zalo-crm
            dockerhub_image: zalo-crm
          - target: web
            ghcr_image: zalo-crm-web
            dockerhub_image: zalo-crm-web

    env:
      GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.ghcr_image }}
      DOCKERHUB_IMAGE: ${{ secrets.DOCKER_USERNAME }}/${{ matrix.dockerhub_image }}
      # Cache dùng chung 1 ref cho cả 2 target - cả 2 chia sẻ stage "builder" giống
      # hệt nhau nên build "web" sau "runtime" (hoặc ngược lại) sẽ hit cache có sẵn.
      CACHE_REF: ghcr.io/${{ github.repository_owner }}/zalo-crm:buildcache

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ github.event_name == 'push' && env.DOCKERHUB_IMAGE || '' }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}
            type=raw,value=26.8.${{ github.run_number }}-manual,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.CACHE_REF }}
          cache-to: type=registry,ref=${{ env.CACHE_REF }},mode=max
          platforms: linux/amd64
          provenance: false
          sbom: false
