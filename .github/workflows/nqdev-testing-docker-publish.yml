name: Testing - ZaloCRM Build Docker Image

on:
  workflow_dispatch:

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}-testing

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=26.8.${{ github.run_number }}-testing

      # push: false -> không publish image, nhưng cache-to vẫn ghi buildcache lên GHCR
      # (chỉ là layer cache để tăng tốc lần build sau, không phải image release)
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcachetesting
          cache-to: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcachetesting,mode=max
          platforms: linux/amd64
          provenance: false
          sbom: false
