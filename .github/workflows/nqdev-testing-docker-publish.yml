name: Testing - ZaloCRM Build Docker Image

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    # Dockerfile có 2 stage image tách riêng: "runtime" (backend headless, không
    # kèm bundle renderer) và "web" (SPA tĩnh qua nginx, không kèm node_modules) -
    # build cả 2 tuần tự trong cùng job (xem max-parallel bên dưới), dùng chung 1
    # buildcache (builder stage giống nhau giữa 2 target giúp tiết kiệm thời gian build).
    strategy:
      # max-parallel: 1 -> 2 target build tuần tự, không chạy song song. Cả 2 dùng
      # chung 1 cache-to ref (buildcachetesting) - chạy song song sẽ ghi đè/conflict
      # khi cả 2 cùng push cache lên cùng 1 tag registry cùng lúc.
      max-parallel: 1
      matrix:
        include:
          - target: runtime
            image: zalo-crm-testing
          - target: web
            image: zalo-crm-web-testing

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=26.8.${{ github.run_number }}-testing

      # push: false -> không publish image, nhưng cache-to vẫn ghi buildcache lên GHCR
      # (chỉ là layer cache để tăng tốc lần build sau, không phải image release)
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/zalo-crm-testing:buildcachetesting
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/zalo-crm-testing:buildcachetesting,mode=max
          platforms: linux/amd64
          provenance: false
          sbom: false
