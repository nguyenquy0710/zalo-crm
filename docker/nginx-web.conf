server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: mọi route không khớp file tĩnh đều fallback về index.html (không dùng
    # react-router-dom - điều hướng là AppView union trong appStore.ts - nhưng vẫn
    # giữ fallback này để tránh 404 khi refresh/deep-link).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
